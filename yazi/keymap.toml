[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "shell '~/.config/yazi/copy-contents.sh %h'"
desc = "Copy file contents"

[[mgr.prepend_keymap]]
on = ["t", "c"]
run = "close"
desc = "Close the current tab"
